name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - runtime: win-x64
            archive: zip
          - runtime: win-x86
            archive: zip
          - runtime: win-arm64
            archive: zip
          - runtime: linux-x64
            archive: tar.gz
          - runtime: linux-arm64
            archive: tar.gz
          - runtime: osx-x64
            archive: tar.gz
          - runtime: osx-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-restore --no-build --output Detailed

      - name: Publish
        run: |
          dotnet publish src -c Release -r ${{ matrix.runtime }} \
            --self-contained false \
            -p:PublishSingleFile=false \
            -p:PublishTrimmed=false \
            -o ./releases/${{ matrix.runtime }}

      - name: Create Archive (zip)
        if: matrix.archive == 'zip'
        run: |
          cd ./releases/${{ matrix.runtime }}
          zip -r ../../buzzard-${{ matrix.runtime }}.zip .

      - name: Create Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd ./releases/${{ matrix.runtime }}
          tar -czf ../../buzzard-${{ matrix.runtime }}.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #7.0.1
        with:
          name: buzzard-${{ matrix.runtime }}
          path: buzzard-${{ matrix.runtime }}.*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #3.0.3
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
